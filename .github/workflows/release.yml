name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: source-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create Release
        uses: stacksjs/action-releaser@v1.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Pantry
        uses: pantry-pm/pantry/packages/action@6243f5d8af665b1568fdfdf4a225da3f35b4da29 # v0.11.179
        with:
          version: '0.11.179'
          publish: zig
          install: 'false'
        env:
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
